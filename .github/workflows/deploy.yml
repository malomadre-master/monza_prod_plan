name: Deploy to Debian

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-monza-prod-plan-production
  cancel-in-progress: true

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  deploy:
    needs: build-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Upload frontend dist
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT || 22 }}
          source: "frontend/dist/*"
          target: /tmp/monza-frontend-dist
          overwrite: true
          rm: true

      - name: Pull backend and restart containers
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT || 22 }}
          command_timeout: 15m
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}"
            APP_DIR="${APP_DIR:-/opt/monza-prod-plan}"
            if [[ ! -d "$APP_DIR/.git" ]]; then
              echo "App not installed. Run deploy/setup-server.sh on the server first."
              exit 1
            fi
            cd "$APP_DIR"
            git config --global --add safe.directory "$APP_DIR" || true
            git checkout -- frontend || true
            git fetch origin
            git checkout main
            git pull --ff-only origin main
            rm -rf "$APP_DIR/frontend/dist"
            mkdir -p "$APP_DIR/frontend/dist"
            if [[ -f /tmp/monza-frontend-dist/index.html ]]; then
              cp -a /tmp/monza-frontend-dist/. "$APP_DIR/frontend/dist/"
            elif [[ -f /tmp/monza-frontend-dist/frontend/dist/index.html ]]; then
              cp -a /tmp/monza-frontend-dist/frontend/dist/. "$APP_DIR/frontend/dist/"
            else
              echo "uploaded dist not found under /tmp/monza-frontend-dist" >&2
              find /tmp/monza-frontend-dist -maxdepth 3 -type f | head
              exit 1
            fi
            rm -rf /tmp/monza-frontend-dist
            SKIP_FRONTEND_BUILD=1 APP_DIR="$APP_DIR" bash deploy/update.sh
