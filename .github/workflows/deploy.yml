name: Deploy to Debian

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-monza-prod-plan-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}"
            APP_DIR="${APP_DIR:-/opt/monza-prod-plan}"
            if [[ ! -d "$APP_DIR/.git" ]]; then
              echo "App not installed. Run deploy/setup-server.sh on the server first."
              exit 1
            fi
            cd "$APP_DIR"
            git config --global --add safe.directory "$APP_DIR" || true
            git fetch origin
            git checkout main
            git pull --ff-only origin main
            APP_DIR="$APP_DIR" bash deploy/update.sh
