<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1c7ed6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MONZA" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <title>MONZA — планирование производства</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var cryptoObj = globalThis.crypto;
        if (cryptoObj && typeof cryptoObj.randomUUID !== "function") {
          try {
            Object.defineProperty(cryptoObj, "randomUUID", {
              configurable: true,
              value: function () {
                return "id-" + Date.now().toString(16) + "-" + Math.random().toString(16).slice(2);
              },
            });
          } catch (err) {}
        }
        window.addEventListener("error", function (event) {
          var root = document.getElementById("root");
          if (!root || root.childElementCount) return;
          root.style.cssText = "font-family:sans-serif;padding:16px;white-space:pre-wrap;color:#b00020";
          root.textContent = (event.error && event.error.stack) || event.message || "Ошибка загрузки";
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
