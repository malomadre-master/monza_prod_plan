# Nginx site for MONZA Production Planner
# Same Debian host as Plitka (:80), KitchenSimples (:8081), Fasad_Monzana (:8082).
# This app is published on :8083. Do not listen on 80/443/8081/8082.

server {
    listen 8083;
    listen [::]:8083;
    server_name _;

    client_max_body_size 50m;
    root /opt/monza-prod-plan/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
